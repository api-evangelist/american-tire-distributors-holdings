x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    ATD runs a real dropship/inventory partner API that every major integration platform
    connects to, but it publishes no developer site at all - api., developer. and developers.
    subdomains of atd.com and atd-us.com do not resolve, atdonline.com 302s every path
    including /openapi.json and /.well-known/* to /login, and the reference plus the API key
    and secret are handed out by an ATD representative only to an approved dealer.
  evidence:
    - url: https://atdonline.com/openapi.json
      status: 302
    - url: https://www.atd.com/.well-known/api-catalog
      status: 404
    - url: https://www.atd.com/login
      status: 404
    - url: https://customer.atd-us.com/.well-known/openid-configuration
      status: 302
    - url: https://atdonline.com/register
