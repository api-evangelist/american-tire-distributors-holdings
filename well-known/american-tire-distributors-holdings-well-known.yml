method: probed
source: >-
  Live unauthenticated GETs of the named /.well-known/ path list against every host American
  Tire Distributors operates that we could identify: the corporate site (www.atd.com), the
  ATDOnline dealer portal (atdonline.com), the ServiceNow customer portal
  (customer.atd-us.com) and the corporate Okta tenant (atd.okta.com) discovered from the
  SAML redirect customer.atd-us.com issues.
note: >-
  ATD serves no /.well-known/ documents from any host it publishes to developers or dealers.
  www.atd.com answers every path with its 404 HTML page; atdonline.com 302s every path to
  /login; customer.atd-us.com 302s every path into an Okta SAML flow. The ONLY 200s in this
  probe came from atd.okta.com, and those documents are Okta platform defaults, not an ATD
  contract: the OIDC discovery document declares issuer https://atd.okta.com and its
  scopes_supported are Okta's own management scopes (okta.users.read, okta.apps.manage,
  okta.logs.read ...), i.e. it describes the Okta management API that every Okta tenant
  exposes, not any API American Tire Distributors publishes. Under the ownership rule those
  bodies were NOT saved into this repo and no WellKnown / SecurityTxt / OAuthScopes pointer is
  emitted from them - ATD itself publishes no well-known surface. This file records the
  absence, which is the finding.
